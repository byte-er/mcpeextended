<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<title>MCPE Extended</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000;
               touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  /* fill the screen in any orientation; the game re-layouts on resize */
  #canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; display: block;
            outline: none; image-rendering: pixelated; }
  #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
             justify-content: center; gap: 12px; color: #ddd; font: 16px sans-serif; background: #1a1410; }
  #bar { width: min(320px, 70vw); height: 6px; background: #333; }
  #bar > div { height: 100%; width: 0; background: #6c3; transition: width .2s; }
  #fs { position: fixed; left: 50%; transform: translateX(-50%); top: 8px; z-index: 2; padding: 6px 10px; font: 13px sans-serif;
        color: #fff; background: rgba(0,0,0,.45); border: 1px solid rgba(255,255,255,.3); border-radius: 4px; }
  #kbd { position: fixed; left: 0; top: 0; width: 1px; height: 1px; opacity: 0; border: 0; padding: 0; font-size: 16px; }
  #skinpick { position: fixed; left: 50%; top: 40%; transform: translateX(-50%); z-index: 3; font: 16px sans-serif; display: flex; gap: 10px; }
  #skinpick[hidden] { display: none; }
  #skinpick label, #skinpick button { padding: 10px 16px; color: #fff; background: rgba(0,0,0,.75); border: 1px solid rgba(255,255,255,.5); border-radius: 6px; cursor: pointer; font: inherit; }
  #skinfile { display: none; }
  #kbdhint { position: fixed; left: 50%; top: 30%; transform: translateX(-50%); z-index: 3; font: 16px sans-serif; padding: 10px 18px;
        color: #fff; background: rgba(0,0,0,.7); border: 1px solid rgba(255,255,255,.5); border-radius: 6px; }
</style>
</head>
<body>
<canvas id="canvas" tabindex="0" oncontextmenu="event.preventDefault()"></canvas>
<div id="loading"><div id="status">Loading…</div><div id="bar"><div></div></div></div>
<button id="fs" hidden>Fullscreen</button>
<input id="kbd" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="send" aria-hidden="true" tabindex="-1">
<button id="kbdhint" hidden>&#9000; Tap to type</button>
<div id="skinpick" hidden><label>Choose skin PNG (64&times;64)<input id="skinfile" type="file" accept="image/png"></label><button id="skincancel">Cancel</button></div>
<script>
  // ---- saves: /persist lives in IndexedDB ----
  var syncing = false;
  function syncSaves() {
    if (syncing || !window.FS) return;
    syncing = true;
    FS.syncfs(false, function () { syncing = false; });
  }
  var Module = {
    canvas: document.getElementById('canvas'),
    preRun: [function () {
      FS.mkdir('/persist');
      FS.mount(IDBFS, {}, '/persist');
      Module.addRunDependency('load-saves');
      FS.syncfs(true, function (err) {
        if (err) console.warn('Could not load saves', err);
        Module.removeRunDependency('load-saves');
      });
    }],
    postRun: [function () {
      document.getElementById('loading').style.display = 'none';
      setInterval(syncSaves, 5000);
    }],
    print: function (t) { console.log(t); },
    printErr: function (t) { console.warn(t); },
    setStatus: function (t) {
      var m = t && t.match(/\((\d+(?:\.\d+)?)\/(\d+)\)/);
      document.getElementById('status').textContent = t ? t.replace(/\(.*\)/, '') : 'Starting…';
      if (m) document.querySelector('#bar > div').style.width = (100 * m[1] / m[2]) + '%';
    }
  };
  // flush saves when the page is hidden / closed (phones kill background tabs)
  document.addEventListener('visibilitychange', function () { if (document.hidden) syncSaves(); });
  window.addEventListener('pagehide', syncSaves);

  // ---- fullscreen + landscape lock where the browser allows it ----
  var fsBtn = document.getElementById('fs');
  if (document.fullscreenEnabled && !matchMedia('(display-mode: fullscreen), (display-mode: standalone)').matches) {
    fsBtn.hidden = false;
    fsBtn.onclick = function () {
      document.documentElement.requestFullscreen().then(function () {
        fsBtn.hidden = true;
        if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(function () {});
      }).catch(function () {});
    };
    document.addEventListener('fullscreenchange', function () { fsBtn.hidden = !!document.fullscreenElement; });
  }

  // ---- soft keyboard for touch browsers ----
  // The game asks for the keyboard (chat, world name...) via mcpeKeyboard(true).
  // A hidden input collects what is typed; differences are fed to the game.
  // It keeps a 2-char sentinel so backspace on an "empty" field still fires.
  (function () {
    var kbd = document.getElementById('kbd'), hint = document.getElementById('kbdhint');
    var SENT = '##', prev = SENT, wanted = false;
    function reset() { kbd.value = SENT; prev = SENT; try { kbd.setSelectionRange(2, 2); } catch (e) {} }
    function key(k) { if (Module._web_kbd_key) Module._web_kbd_key(k); }
    function chr(c) { if (Module._web_kbd_char) Module._web_kbd_char(c); }
    function focusKbd() { reset(); kbd.focus({ preventScroll: true }); hint.hidden = document.activeElement === kbd; }
    kbd.addEventListener('input', function (e) {
      var v = kbd.value, p = 0;
      while (p < prev.length && p < v.length && prev[p] === v[p]) p++;
      for (var i = prev.length; i > p; --i) key(8);
      for (var j = p; j < v.length; ++j) { var c = v.charCodeAt(j); if (c === 10 || c === 13) key(13); else chr(c); }
      prev = v;
      if (!e.isComposing) reset();
    });
    // keep these key events away from GLFW's window listeners (registered later)
    ['keydown', 'keypress', 'keyup'].forEach(function (type) {
      window.addEventListener(type, function (e) {
        if (e.target !== kbd) return;
        e.stopImmediatePropagation();
        if (type === 'keydown' && !e.isComposing) {
          if (e.key === 'Enter') { e.preventDefault(); key(13); }
          else if (e.key === 'Escape') { e.preventDefault(); key(27); }
        }
      }, true);
    });
    kbd.addEventListener('blur', function () { if (wanted) hint.hidden = false; });
    hint.addEventListener('click', function (e) { e.preventDefault(); focusKbd(); });
    window.mcpeKeyboard = function (show) {
      wanted = show;
      if (show) { focusKbd(); setTimeout(function () { if (wanted) hint.hidden = document.activeElement === kbd; }, 150); }
      else { hint.hidden = true; kbd.blur(); }
    };
  })();

  // ---- custom skin: pick a PNG, store it where the game reads skin.png ----
  (function () {
    var box = document.getElementById('skinpick'), input = document.getElementById('skinfile'), dest = '';
    document.getElementById('skincancel').onclick = function () { box.hidden = true; };
    window.mcpePickSkin = function (path) { dest = path; input.value = ''; box.hidden = false; };
    input.onchange = function () {
      var f = input.files && input.files[0];
      box.hidden = true;
      if (!f) return;
      f.arrayBuffer().then(function (buf) {
        var url = URL.createObjectURL(new Blob([buf], { type: 'image/png' })), img = new Image();
        img.onload = function () {
          URL.revokeObjectURL(url);
          if (img.width !== 64 || (img.height !== 64 && img.height !== 32)) { alert('Skins must be 64x64 or 64x32 PNG images.'); return; }
          var dir = dest.substring(0, dest.lastIndexOf('/')), parts = dir.split('/'), p = '';
          for (var i = 1; i < parts.length; ++i) { p += '/' + parts[i]; try { FS.mkdir(p); } catch (e) {} }
          FS.writeFile(dest, new Uint8Array(buf));
          syncSaves();
          if (Module._web_skin_changed) Module._web_skin_changed();
        };
        img.onerror = function () { URL.revokeObjectURL(url); alert('That file is not a PNG image.'); };
        img.src = url;
      });
    };
  })();

  // ---- offline support ----
  if ('serviceWorker' in navigator && location.protocol !== 'file:')
    navigator.serviceWorker.register('sw.js').catch(function () {});
</script>
{{{ SCRIPT }}}
</body>
</html>
